[package]
name = "cspAI"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.11.1"
futures-util = "0.3.32"
reqwest = { version = "0.13.3", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = "0.1.18"
tower-http = { version = "0.6.11", features = ["cors"] }
