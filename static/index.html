<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ResumeBoost AI</title>

        <style>
            body {
                margin: 0;
                font-family: system-ui, Arial, sans-serif;
                background: #0b1220;
                color: #e5e7eb;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
            }

            .app {
                width: 92%;
                max-width: 850px;
                background: #111827;
                border-radius: 16px;
                padding: 24px;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            }

            h1 {
                margin: 0;
                font-size: 28px;
            }

            p {
                color: #9ca3af;
                margin-top: 6px;
            }

            textarea {
                width: 100%;
                height: 140px;
                margin-top: 16px;
                padding: 12px;
                border-radius: 10px;
                border: 1px solid #374151;
                background: #0f172a;
                color: white;
                resize: none;
                font-size: 14px;
                outline: none;
                box-sizing: border-box;
            }

            textarea:focus {
                border-color: #3b82f6;
            }

            .row {
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }

            button {
                flex: 1;
                padding: 12px;
                border: none;
                border-radius: 10px;
                background: #2563eb;
                color: white;
                font-weight: 600;
                cursor: pointer;
            }

            button:hover {
                background: #1d4ed8;
            }

            button:disabled {
                background: #374151;
                cursor: not-allowed;
            }

            .output {
                margin-top: 18px;
                padding: 14px;
                background: #0f172a;
                border: 1px solid #374151;
                border-radius: 10px;
                min-height: 120px;
                font-size: 14px;
                line-height: 1.8;
                word-wrap: break-word;
                overflow-wrap: break-word;
            }

            .tag {
                font-size: 12px;
                color: #60a5fa;
                margin-top: 8px;
            }

            /* Blinking cursor shown while streaming */
            .cursor {
                display: inline-block;
                width: 2px;
                height: 1em;
                background: #60a5fa;
                margin-left: 2px;
                vertical-align: text-bottom;
                animation: blink 0.8s step-end infinite;
            }

            @keyframes blink {
                50% {
                    opacity: 0;
                }
            }
        </style>
    </head>

    <body>
        <div class="app">
            <h1>ResumeBoost AI</h1>
            <p>
                Turn simple experiences into professional resume bullets using
                AI.
            </p>

            <textarea
                id="input"
                placeholder="Example: helped teacher organize papers..."
            ></textarea>

            <div class="row">
                <button id="btn">Boost Resume</button>
                <button id="clear">Clear</button>
            </div>

            <div class="tag">Status: <span id="status">Idle</span></div>

            <div class="output" id="output">Output will appear here...</div>
        </div>

        <script>
            const input = document.getElementById("input");
            const btn = document.getElementById("btn");
            const clear = document.getElementById("clear");
            const output = document.getElementById("output");
            const status = document.getElementById("status");

            btn.onclick = async () => {
                const text = input.value.trim();
                if (!text) {
                    output.textContent = "Please enter an experience.";
                    return;
                }

                btn.disabled = true;
                status.textContent = "Generating...";
                output.textContent = "Thinking...";

                try {
                    const res = await fetch("/ping", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ input: text }),
                    });

                    if (!res.ok) throw new Error(`Server error: ${res.status}`);

                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });

                        // Render incrementally so the user sees tokens arrive,
                        // but collapse stray newlines that are streaming artifacts.
                        output.innerHTML = formatBullets(buffer);
                    }

                    buffer += decoder.decode();
                    output.innerHTML = formatBullets(buffer);
                    status.textContent = "Done";
                } catch (err) {
                    output.textContent = "Error: " + err.message;
                    status.textContent = "Failed";
                }

                btn.disabled = false;
            };

            function formatBullets(raw) {
                // Collapse multiple newlines/spaces into single spaces,
                // but split on bullet markers (•, -, *) to put each on its own line.
                const cleaned = raw
                    .replace(/\r\n/g, "\n")
                    .replace(/\n+/g, " ") // collapse all newlines to spaces first
                    .replace(/\s{2,}/g, " ") // collapse multiple spaces
                    .trim();

                // Split on bullet markers that appear mid-string
                const lines = cleaned
                    .split(/(?=[-•*]\s)/) // split before each bullet marker
                    .map((l) => l.trim())
                    .filter(Boolean);

                if (lines.length <= 1) {
                    // No bullets detected yet — just show as plain text while streaming
                    return `<span>${escapeHtml(cleaned)}</span>`;
                }

                return lines
                    .map(
                        (line) =>
                            `<div style="margin-bottom:8px">${escapeHtml(line)}</div>`,
                    )
                    .join("");
            }

            function escapeHtml(str) {
                return str
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;");
            }

            clear.onclick = () => {
                input.value = "";
                output.textContent = "Output will appear here...";
                status.textContent = "Idle";
            };
        </script>
    </body>
</html>
